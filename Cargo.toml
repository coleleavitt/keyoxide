[package]
name = "keyoxide"
version = "0.1.0"
edition = "2021"
description = "Minimal no-prompt SSH and GPG agent"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# SSH key handling
ssh-key = { version = "0.6", features = ["encryption", "ed25519", "rsa", "p256", "p384"] }
signature = "2"

# Cryptography. Stays on the RustCrypto generation that rsa 0.9 and
# ssh-key 0.6 use (sha2 0.10, p256 0.13, ed25519-dalek 2, signature 2):
# rsa 0.10 and ssh-key 0.7 are still release candidates. Move the whole
# set together once both are stable.
rsa = { version = "0.9", features = ["sha2", "hazmat"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
# "oid" for PKCS#1 v1.5 SHA-1 signatures (SSH "ssh-rsa")
sha1 = { version = "0.10", features = ["oid"] }
rand = "0.8"
aes = "0.8"
cbc = "0.1"
ocb3 = "0.1"
# Curve25519 ECDH for PKDECRYPT with cv25519 subkeys
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
# IMPORT_KEY: AES key wrap (RFC 3394) and OpenPGP CFB secret-key protection
aes-kw = { version = "0.2", features = ["alloc"] }
cfb-mode = "0.8"


# Security
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
hex = "0.4"
base64 = "0.23"
dirs = "7"
bytes = "1"
parking_lot = "0.13"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tracing-test = "0.2"

[profile.release]
lto = true
strip = true
